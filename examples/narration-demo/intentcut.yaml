version: 1

project:
  title: IntentCut Temporary Narration
  resolution:
    width: 1920
    height: 1080
  fps: 30
  maximumDuration: 20s

scenes:
  - id: opening
    type: image
    source: ../../../orbweaver/challenge-video/assets/01-opening-card.png
    duration: 8s
    motion:
      type: push-in
      from: 1
      to: 1.04

  - id: closing
    type: image
    source: ../../../orbweaver/challenge-video/assets/02-closing-card.png
    duration: 9s

audio:
  narration:
    generatedDirectory: narration/generated
    sections:
      - id: opening
        scene: opening
        script: narration/01-opening.md
        mode: synthetic-prototype
        rate: 185
      - id: closing
        scene: closing
        script: narration/02-closing.md
        mode: synthetic-prototype
        rate: 185
  loudness:
    integrated: -16
    truePeak: -1.5
    range: 7

output:
  file: renders/narration-preview.mp4
  codec: h264
  reportDirectory: reports
