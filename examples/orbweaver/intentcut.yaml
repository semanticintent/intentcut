version: 1

project:
  title: Orbweaver WebMCP Challenge
  resolution:
    width: 1920
    height: 1080
  fps: 30
  maximumDuration: 3m

scenes:
  - id: opening
    type: image
    source: ../../../orbweaver/challenge-video/assets/01-opening-card.png
    duration: 5s
    motion:
      type: push-in
      from: 1
      to: 1.05

  - id: create-proposal
    type: video
    source: ../../../orbweaver/challenge-video/recordings/screen/01-create.mov
    trim:
      in: 0s
      out: 182.788s
    speed: 4

  - id: revise-and-undo
    type: video
    source: ../../../orbweaver/challenge-video/recordings/screen/02-revise-undo.mov
    trim:
      in: 0s
      out: 112.915s
    speed: 1
    camera:
      - at: 20s
        duration: 5s
        transition: 750ms
        zoom: 1.15
        center:
          x: 0.74
          y: 0.58

  - id: closing
    type: image
    source: ../../../orbweaver/challenge-video/assets/02-closing-card.png
    duration: 8.388s

annotations:
  - id: trust-boundary
    at: 1.05m
    duration: 4s
    text: Validated ≠ accepted
    position: bottom-right
    tone: warning

audio:
  narration:
    source: ../../../orbweaver/challenge-video/exports/Orbweaver-WebMCP-Challenge-Demo-FINAL.mp4
    mode: human-final
  loudness:
    integrated: -16
    truePeak: -1.5
    range: 7

output:
  file: renders/orbweaver-preview.mp4
  codec: h264
  reportDirectory: reports
